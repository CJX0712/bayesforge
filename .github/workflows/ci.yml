name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # Pin the scientific stack to the versions in requirements.lock.txt:
          # numpy Generator streams and scipy L-BFGS are NOT stable across
          # versions/BLAS backends, and the BO loop amplifies numeric drift
          # chaotically — unpinned runs would make the quality gates flaky.
          python -m pip install "numpy==2.5.3" "scipy==1.18.1" "pytest==9.1.1" "ruff==0.16.9"
          python -m pip install -e . --no-deps

      - name: Lint
        run: ruff check bayesforge tests examples

      - name: Test
        run: pytest -q

      - name: Determinism check
        run: python -m bayesforge.cli check --n-evals 16

      - name: Demo smoke
        run: python examples/run_demo.py
